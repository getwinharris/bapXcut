name: 🐛 Bug Report
description: Report a bug, crash, or rendering issue in bapXcut
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve **bapXcut**! Please fill in as many details as possible so we can reproduce and fix the issue quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What went wrong? Describe what happened while using bapXcut.
      placeholder: E.g., The app crashed while attempting to cut a 1080p video clip on the timeline...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open bapXcut and import a video
        2. Move seekbar to 00:05 and tap 'Cut'
        3. Select the second segment and tap 'Delete'
        4. See LC-500 Error / App crashes
    validations:
      required: true

  - type: dropdown
    id: error_code
    attributes:
      label: Error Code (If Displayed)
      description: Did bapXcut show an error code dialog?
      options:
        - None / No Error Screen
        - LC-101 (FFmpeg execution failed)
        - LC-301 (Video export / render failed)
        - LC-404 (Media file access / path missing)
        - LC-500 (Application crash / OutOfMemory)
        - LC-600 (Audio extraction / wave processing error)

  - type: dropdown
    id: affected_feature
    attributes:
      label: Feature Affected
      description: Which area of bapXcut were you using when the bug occurred?
      options:
        - Timeline / Cut / Split Clips
        - Media Import / Picker
        - Text / Image Overlay
        - Video Export / FFmpeg Rendering
        - Audio / Background Music / Mute
        - Filters / Speed / Reverse / Aspect Ratio
        - Project Save / Load (.lcprj)
        - Other

  - type: input
    id: video_specs
    attributes:
      label: Source Video Specifications (Optional)
      description: Resolution, FPS, format, or length of the video being edited.
      placeholder: E.g. 1080p 60fps MP4, 4K HEVC, 5 minute video
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Device Model & RAM
      description: Phone/Tablet model and total RAM.
      placeholder: E.g. Pixel 2 (4GB RAM), Samsung S23 (8GB RAM)
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android OS Version
      description: E.g. Android 11, Android 14, LineageOS 21
      placeholder: E.g. Android 13
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: bapXcut App Version / Build
      description: E.g. v0.5.0-beta6 or git commit hash
      placeholder: E.g. v0.5.0-beta6
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Crash Logs / Error Stack Trace (If available)
      description: Paste logcat or crash error trace here.
      render: shell
    validations:
      required: false

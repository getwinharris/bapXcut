name: ✨ Feature Request
description: Suggest a feature, editing tool, or UI enhancement for bapXcut
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new feature, video effect, or workflow improvement in **bapXcut**? We would love to hear it!

  - type: dropdown
    id: feature_category
    attributes:
      label: Feature Category
      description: Which area of bapXcut does this feature relate to?
      options:
        - Timeline & Cut / Split Tools
        - Transitions & Visual Effects
        - Text, Stickers & Image Overlays
        - Audio, Music & Voiceover
        - Filters, Color Grading & Adjustments
        - Export Formats, Resolution & Encoder Options
        - Project Templates & Saving (.lcprj)
        - UI / UX & Performance
        - Other

  - type: textarea
    id: problem
    attributes:
      label: Problem or Limitation
      description: What problem are you trying to solve or what limitation are you encountering?
      placeholder: E.g., When working with multi-clip sequences, it is hard to align text overlays across transitions...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature Idea
      description: Describe the feature you would like to see added to bapXcut.
      placeholder: E.g., Add a snapping feature for text overlays to lock onto clip boundaries...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any workarounds or alternative solutions you have considered.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context, Screenshots, or References
      description: Add any mockups, reference video links, or screenshots illustrating the idea.
    validations:
      required: false

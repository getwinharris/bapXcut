name: Automated Issue Test Build

on:
  push:
    branches:
      - 'fix/*'
      - 'fix-*'

permissions:
  contents: read
  issues: write

jobs:
  build-and-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Issue Number from Branch Name
        id: extract_issue
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          echo "Branch: $BRANCH_NAME"
          ISSUE_NUM=$(echo "$BRANCH_NAME" | sed -nE 's#^fix[/-]?(issue-)?([0-9]+).*#\2#p')
          if [ -z "$ISSUE_NUM" ]; then
            echo "Could not extract issue number from branch name '$BRANCH_NAME'. Skipping automated comment."
            exit 0
          fi
          echo "issue_number=$ISSUE_NUM" >> $GITHUB_OUTPUT
          echo "Successfully extracted Issue Number: #$ISSUE_NUM"

      - name: Checkout Code
        if: steps.extract_issue.outputs.issue_number != ''
        uses: actions/checkout@v4

      - name: Set up Java 17
        if: steps.extract_issue.outputs.issue_number != ''
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: steps.extract_issue.outputs.issue_number != ''
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        if: steps.extract_issue.outputs.issue_number != ''
        run: chmod +x gradlew

      - name: Build Debug APK
        if: steps.extract_issue.outputs.issue_number != ''
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        if: steps.extract_issue.outputs.issue_number != ''
        uses: actions/upload-artifact@v4
        with:
          name: bapXcut-Fix-Issue-${{ steps.extract_issue.outputs.issue_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Post or Update Automated Comment on Issue
        if: steps.extract_issue.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.extract_issue.outputs.issue_number }}
        run: |
          BODY=$(cat << 'EOF'
          🧪 **Latest Test Build Available for Issue #${{ steps.extract_issue.outputs.issue_number }}**

          A test build has been automatically generated from branch `${{ github.ref_name }}` (Commit `${{ github.sha }}`).

          ### 📥 Download & Test APK:
          - 🚀 **[Direct APK Download Link (nightly.link)](https://nightly.link/${{ github.repository }}/workflows/issue-test-build.yml/${{ github.sha }}/bapXcut-Fix-Issue-${{ steps.extract_issue.outputs.issue_number }}.zip)**
          - 📦 **[Alternative: GitHub Actions Build Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**

          ---

          ### 📝 Instructions for Tester:
          Please install this APK and verify if the reported issue is fixed on your device.
          - ✅ **If fixed:** Please reply to confirm so we can merge this fix into `main` and close the issue.
          - ❌ **If not fixed:** Reply with details on what happened so we can update the fix.

          *Note: Download links remain active for 7 days. This comment is automatically updated whenever new commits are pushed.*
          EOF
          )

          EXISTING_COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUM}/comments" --jq '.[] | select(.user.login=="github-actions[bot]" or .user.login=="github-actions") | select(.body | contains("Test Build Available for Issue")) | .id' | head -n 1)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            echo "Updating existing comment #$EXISTING_COMMENT_ID to prevent issue comment spamming..."
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT_ID" -f body="$BODY"
          else
            echo "Creating initial test build comment on issue #$ISSUE_NUM..."
            gh issue comment "$ISSUE_NUM" --body "$BODY"
          fi

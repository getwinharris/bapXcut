name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Assemble debug
        run: ./gradlew assembleDebug
      - name: Lint
        run: ./gradlew lintDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Create or update PR & Issue comment
        uses: actions/github-script@v7
        with:
          script: |
            const bodyIdentifier = '### 🤖 Automated Build APK Ready!';
            const branchName = context.payload.pull_request ? context.payload.pull_request.head.ref : context.ref.replace('refs/heads/', '');
            const body = `${bodyIdentifier}\n\nA new debug APK build is ready for testing.\n\n* **Commit:** \`${context.sha}\`\n* **Branch:** \`${branchName}\` \n\n📥 **Download Artifact:** You can download the build artifact directly from the [GitHub Actions CI Run Page](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;

            // Helper to post or update comment on a target issue/PR ID
            async function postOrUpdateComment(targetId) {
              try {
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: targetId,
                });

                const botComment = comments.find(comment =>
                  comment.user.type === 'Bot' && comment.body.includes(bodyIdentifier)
                );

                if (botComment) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComment.id,
                    body: body,
                  });
                  console.log(`Updated comment on #${targetId}`);
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: targetId,
                    body: body,
                  });
                  console.log(`Created new comment on #${targetId}`);
                }
              } catch (err) {
                console.log(`Failed to comment on #${targetId}: ${err.message}`);
              }
            }

            const targets = new Set();

            // 1. If running on a PR, add the PR number
            if (context.issue && context.issue.number) {
              targets.add(context.issue.number);
            }

            // 2. Extract issue number from PR body, branch name, or commit message
            const prBody = context.payload.pull_request ? (context.payload.pull_request.body || '') : '';
            const commitMsg = context.payload.head_commit ? (context.payload.head_commit.message || '') : '';
            const fullText = `${prBody} ${branchName} ${commitMsg}`;

            const match = fullText.match(/(?:fixes|closes|resolves|issue|fix)[\s/#-]*(\d+)/i);
            if (match) {
              const issueId = parseInt(match[1], 10);
              if (issueId) {
                targets.add(issueId);
              }
            }

            for (const targetId of targets) {
              await postOrUpdateComment(targetId);
            }

